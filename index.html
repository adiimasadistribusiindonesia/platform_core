<script>
const SUPABASE_URL="https://fysaxpqpqexjnlpkbwap.supabase.co";
const SUPABASE_KEY="sb_publishable_DWRaEaZTcNMjhglwN3nqCOw_pua8rsjD";

const REDIRECT =
  location.hostname === "adiimasadistribusiindonesia.github.io"
    ? "https://adiimasadistribusiindonesia.github.io/platform_core/"
    : location.origin + "/core_adiimasa.html";

let accessToken=null, refreshToken=null, currentUser=null, data=[];

const $=id=>document.getElementById(id);

function headers(){
  return {
    apikey:SUPABASE_KEY,
    Authorization:"Bearer "+accessToken,
    "Content-Type":"application/json",
    Accept:"application/json"
  };
}

function setMsg(t,err=false){
  $("loginMsg").textContent=t;
  $("loginMsg").className="msg "+(err?"err":"ok");
}

function saveSession(s){
  accessToken=s.access_token||null;
  refreshToken=s.refresh_token||null;

  if(accessToken)
    localStorage.setItem("core_access_token",accessToken);

  if(refreshToken)
    localStorage.setItem("core_refresh_token",refreshToken);
}

function clearSession(){
  accessToken=null;
  refreshToken=null;

  localStorage.removeItem("core_access_token");
  localStorage.removeItem("core_refresh_token");
  localStorage.removeItem("core_login_intent");
  sessionStorage.removeItem("core_pkce_verifier");
}

/* =========================
   PKCE HELPERS
========================= */

function base64UrlEncode(buffer){
  let binary="";
  const bytes=new Uint8Array(buffer);

  for(let i=0;i<bytes.length;i++){
    binary+=String.fromCharCode(bytes[i]);
  }

  return btoa(binary)
    .replace(/\+/g,"-")
    .replace(/\//g,"_")
    .replace(/=/g,"");
}

function generateCodeVerifier(){
  const bytes=new Uint8Array(32);
  crypto.getRandomValues(bytes);
  return base64UrlEncode(bytes);
}

async function generateCodeChallenge(verifier){
  const data=new TextEncoder().encode(verifier);
  const hash=await crypto.subtle.digest("SHA-256",data);
  return base64UrlEncode(hash);
}

/* =========================
   GOOGLE LOGIN
========================= */

async function loginGoogle(){

  try{

    localStorage.setItem("core_login_intent","1");

    const verifier=generateCodeVerifier();

    sessionStorage.setItem(
      "core_pkce_verifier",
      verifier
    );

    const challenge=await generateCodeChallenge(verifier);

    const params=new URLSearchParams({
      provider:"google",
      redirect_to:REDIRECT,
      code_challenge:challenge,
      code_challenge_method:"S256",
      flow_type:"pkce"
    });

    location.href=
      SUPABASE_URL+
      "/auth/v1/authorize?"+
      params.toString();

  }catch(e){

    console.error("Google login error:",e);

    localStorage.removeItem("core_login_intent");

    setMsg(
      "Gagal memulai login Google: "+e.message,
      true
    );
  }
}

/* =========================
   OAUTH CALLBACK
========================= */

async function parseOAuth(){

  const url=new URL(location.href);

  /*
   * PKCE:
   * Supabase mengembalikan ?code=...
   */

  const code=url.searchParams.get("code");

  if(code){

    const verifier=
      sessionStorage.getItem("core_pkce_verifier");

    if(!verifier){
      throw new Error(
        "Kode login ditemukan, tetapi PKCE verifier tidak ditemukan. Silakan login ulang."
      );
    }

    setMsg("Memproses login Google...");

    const response=await fetch(
      SUPABASE_URL+"/auth/v1/token?grant_type=pkce",
      {
        method:"POST",
        headers:{
          apikey:SUPABASE_KEY,
          "Content-Type":"application/x-www-form-urlencoded",
          Accept:"application/json"
        },
        body:new URLSearchParams({
          code:code,
          code_verifier:verifier
        }).toString()
      }
    );

    const result=await response.json();

    if(!response.ok){

      console.error(
        "PKCE exchange failed:",
        result
      );

      throw new Error(
        result.msg ||
        result.message ||
        result.error_description ||
        "Gagal menukar kode login Google menjadi session."
      );
    }

    saveSession(result);

    sessionStorage.removeItem("core_pkce_verifier");
    localStorage.removeItem("core_login_intent");

    /*
     * Bersihkan ?code= dari address bar
     */
    history.replaceState(
      {},
      document.title,
      location.pathname
    );

    return true;
  }

  /*
   * Tetap dukung Implicit Flow lama
   * jika suatu saat Supabase mengembalikan token
   * melalui URL hash.
   */

  const hash=new URLSearchParams(
    location.hash.slice(1)
  );

  const hashAccess=hash.get("access_token");

  if(hashAccess){

    saveSession({
      access_token:hashAccess,
      refresh_token:hash.get("refresh_token")
    });

    localStorage.removeItem("core_login_intent");

    history.replaceState(
      {},
      document.title,
      location.pathname
    );

    return true;
  }

  return false;
}

/* =========================
   USER / SESSION
========================= */

async function getUser(){

  const r=await fetch(
    SUPABASE_URL+"/auth/v1/user",
    {
      headers:headers()
    }
  );

  if(!r.ok){

    const text=await r.text();

    console.error(
      "getUser failed:",
      r.status,
      text
    );

    throw new Error(
      "Sesi login tidak valid."
    );
  }

  return r.json();
}

async function refreshSession(){

  const rt=
    refreshToken ||
    localStorage.getItem(
      "core_refresh_token"
    );

  if(!rt)
    return false;

  const r=await fetch(
    SUPABASE_URL+
    "/auth/v1/token?grant_type=refresh_token",
    {
      method:"POST",
      headers:{
        apikey:SUPABASE_KEY,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        refresh_token:rt
      })
    }
  );

  if(!r.ok){

    clearSession();

    return false;
  }

  const session=await r.json();

  saveSession(session);

  return true;
}

/* =========================
   CORE ADMIN CHECK
========================= */

async function isCoreAdmin(email){

  const r=await fetch(
    SUPABASE_URL+
    "/rest/v1/core_adiimasa_admins"+
    "?select=email,name,is_active"+
    "&email=eq."+
    encodeURIComponent(email.toLowerCase())+
    "&is_active=eq.true",
    {
      headers:headers()
    }
  );

  if(!r.ok){

    throw new Error(
      "Gagal memeriksa hak akses Core Adiimasa (HTTP "+
      r.status+
      ")."
    );
  }

  const rows=await r.json();

  return rows[0]||null;
}

/* =========================
   LOAD DATA
========================= */

async function load(){

  const r=await fetch(
    SUPABASE_URL+
    "/rest/v1/geparu_admin_access"+
    "?select=id,email,core_name,module_slug,client_name,approval_status,is_active,created_at,approved_at,rejected_at,approval_note"+
    "&order=created_at.desc",
    {
      headers:headers()
    }
  );

  if(!r.ok){

    const t=await r.text();

    throw new Error(
      "Gagal memuat permintaan akses (HTTP "+
      r.status+
      ") "+
      t
    );
  }

  data=await r.json();

  render();
}

/* =========================
   BADGE
========================= */

function badge(s){
  return '<span class="badge b-'+
    s.toLowerCase()+
    '">'+
    s+
    '</span>';
}

/* =========================
   RENDER
========================= */

function render(){

  const q=$("search").value.toLowerCase();
  const st=$("status").value;

  let list=data.filter(x=>
    (st==="ALL"||x.approval_status===st)&&
    (
      !q||
      [
        x.email,
        x.client_name,
        x.module_slug,
        x.core_name
      ]
      .join(" ")
      .toLowerCase()
      .includes(q)
    )
  );

  let c={
    PENDING:0,
    APPROVED:0,
    REJECTED:0,
    SUSPENDED:0
  };

  data.forEach(x=>
    c[x.approval_status]=
      (c[x.approval_status]||0)+1
  );

  ["Pending","Approved","Rejected","Suspended"]
    .forEach(k=>
      $("n"+k).textContent=
        c[k.toUpperCase()]||0
    );

  if(!list.length){

    $("tbody").innerHTML=
      '<tr><td colspan="6" class="empty">'+
      'Belum ada data permintaan akses.'+
      '</td></tr>';

    return;
  }

  $("tbody").innerHTML=
    list.map(x=>`

      <tr>

        <td>
          <b>${esc(x.email)}</b>
        </td>

        <td>
          ${esc(
            x.core_name||
            'PT Adiimasa Distribusi Indonesia'
          )}
        </td>

        <td>
          ${esc(
            (x.module_slug||'').toUpperCase()
          )}
        </td>

        <td>
          ${esc(
            x.client_name||'GEPARU'
          )}
        </td>

        <td>
          ${badge(x.approval_status)}
        </td>

        <td>

          <div class="actions">

            ${
              x.approval_status==='PENDING'
              ?
              `
                <button
                  class="btn ok"
                  onclick="act('${x.id}','APPROVED')"
                >
                  SETUJUI
                </button>

                <button
                  class="btn no"
                  onclick="act('${x.id}','REJECTED')"
                >
                  TOLAK
                </button>
              `
              :
              ''
            }

            ${
              x.approval_status==='APPROVED'
              ?
              `
                <button
                  class="btn warn"
                  onclick="act('${x.id}','SUSPENDED')"
                >
                  SUSPEND
                </button>
              `
              :
              ''
            }

            ${
              x.approval_status==='SUSPENDED'
              ?
              `
                <button
                  class="btn ok"
                  onclick="act('${x.id}','APPROVED')"
                >
                  AKTIFKAN
                </button>
              `
              :
              ''
            }

          </div>

        </td>

      </tr>

    `).join('');
}

/* =========================
   ESCAPE HTML
========================= */

function esc(v){

  return String(v??'')
    .replace(
      /[&<>'"]/g,
      m=>({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        "'":'&#39;',
        '"':'&quot;'
      }[m])
    );
}

/* =========================
   APPROVAL ACTION
========================= */

async function act(id,status){

  let note='';

  if(
    status==='REJECTED' &&
    !confirm('Tolak permintaan akses ini?')
  )
    return;

  if(
    status==='APPROVED' &&
    !confirm('Setujui akses client ini?')
  )
    return;

  if(
    status==='SUSPENDED' &&
    !confirm('Tangguhkan akses client ini?')
  )
    return;

  const body={
    approval_status:status,
    is_active:status==='APPROVED'
  };

  if(status==='APPROVED'){

    body.approved_at=
      new Date().toISOString();

    body.rejected_at=null;
  }

  if(status==='REJECTED'){

    body.rejected_at=
      new Date().toISOString();

    body.approved_at=null;
  }

  if(status==='SUSPENDED'){

    body.approved_at=null;
  }

  const r=await fetch(
    SUPABASE_URL+
    "/rest/v1/geparu_admin_access?id=eq."+
    encodeURIComponent(id),
    {
      method:'PATCH',
      headers:{
        ...headers(),
        Prefer:'return=minimal'
      },
      body:JSON.stringify(body)
    }
  );

  if(!r.ok){

    alert(
      'Gagal mengubah status: '+
      await r.text()
    );

    return;
  }

  await load();

  toast(
    'Status berhasil diubah menjadi '+
    status
  );
}

/* =========================
   TOAST
========================= */

function toast(t){

  const e=document.createElement('div');

  e.className='toast';

  e.textContent=t;

  document.body.appendChild(e);

  setTimeout(
    ()=>e.remove(),
    2600
  );
}

/* =========================
   BOOT
========================= */

async function boot(){

  try{

    /*
     * PENTING:
     * Tunggu OAuth/PKCE selesai dahulu.
     */
    await parseOAuth();

    accessToken=
      localStorage.getItem(
        'core_access_token'
      );

    refreshToken=
      localStorage.getItem(
        'core_refresh_token'
      );

    /*
     * Kalau belum ada access token,
     * coba refresh.
     */
    if(
      !accessToken &&
      refreshToken
    ){

      await refreshSession();
    }

    /*
     * Tetap tidak ada session.
     */
    if(!accessToken){

      $("loginOverlay")
        .classList
        .remove("hidden");

      return;
    }

    /*
     * Sekarang baru cek user.
     */
    currentUser=
      await getUser();

    /*
     * Pastikan email adalah Core Admin.
     */
    const admin=
      await isCoreAdmin(
        currentUser.email
      );

    if(!admin){

      clearSession();

      $("loginOverlay")
        .classList
        .remove("hidden");

      setMsg(
        'Akun Google berhasil login, tetapi belum terdaftar sebagai Core Admin. Tambahkan email ini ke daftar Core Admin.',
        true
      );

      return;
    }

    $("userEmail").textContent=
      currentUser.email;

    $("loginOverlay")
      .classList
      .add("hidden");

    $("app")
      .classList
      .remove("hidden");

    await load();

  }catch(e){

    console.error(
      "BOOT ERROR:",
      e
    );

    clearSession();

    $("loginOverlay")
      .classList
      .remove("hidden");

    setMsg(
      e.message ||
      "Terjadi kesalahan saat login.",
      true
    );
  }
}

/* =========================
   EVENTS
========================= */

$("googleBtn").onclick=
  loginGoogle;

$("logoutBtn").onclick=()=>{
  clearSession();
  location.reload();
};

$("refresh").onclick=()=>
  load().catch(
    e=>alert(e.message)
  );

$("search").oninput=
  render;

$("status").onchange=
  render;

/* START */
boot();

</script>
