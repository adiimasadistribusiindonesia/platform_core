<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Core Adiimasa - Pusat Kendali</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Inter,Segoe UI,Arial,sans-serif;
  background:#667681;
  color:#18324a;
  min-height:100vh;
}

.hidden{
  display:none !important;
}

.login-wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-card{
  width:100%;
  max-width:430px;
  background:white;
  border-radius:20px;
  padding:34px 30px;
  box-shadow:0 20px 50px rgba(0,0,0,.18);
}

.brand{
  font-size:13px;
  font-weight:800;
  letter-spacing:1px;
  color:#58748b;
  margin-bottom:8px;
}

h1{
  margin:0 0 16px;
  font-size:32px;
  line-height:1.15;
}

.desc{
  color:#6d8090;
  font-size:14px;
  line-height:1.65;
  margin-bottom:24px;
}

.google-btn{
  width:100%;
  height:50px;
  border:1px solid #cbd7df;
  background:white;
  border-radius:9px;
  cursor:pointer;
  font-size:16px;
  font-weight:700;
  color:#203e56;
  transition:.2s;
}

.google-btn:hover{
  background:#f5f8fa;
}

.google-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.msg{
  text-align:center;
  margin-top:14px;
  font-size:13px;
  min-height:18px;
}

.msg.err{
  color:#d93025;
}

.msg.ok{
  color:#198754;
}

.app{
  min-height:100vh;
  background:#f4f7f9;
}

.topbar{
  height:70px;
  background:white;
  border-bottom:1px solid #dce4e9;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
}

.logo{
  font-weight:800;
  color:#18324a;
}

.user-area{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:13px;
}

.logout{
  border:0;
  background:#e9eef2;
  padding:9px 14px;
  border-radius:8px;
  cursor:pointer;
  font-weight:700;
}

.content{
  padding:30px;
  max-width:1300px;
  margin:auto;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
  gap:15px;
}

.header h2{
  margin:0;
}

.refresh{
  border:0;
  background:#183b56;
  color:white;
  padding:10px 16px;
  border-radius:8px;
  cursor:pointer;
  font-weight:700;
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:25px;
}

.card{
  background:white;
  border-radius:12px;
  padding:20px;
  border:1px solid #e1e8ed;
}

.card-title{
  color:#748796;
  font-size:13px;
}

.card-number{
  font-size:28px;
  font-weight:800;
  margin-top:6px;
}

.toolbar{
  background:white;
  padding:15px;
  border-radius:12px;
  display:flex;
  gap:12px;
  margin-bottom:15px;
}

.toolbar input,
.toolbar select{
  padding:11px 13px;
  border:1px solid #ccd8df;
  border-radius:8px;
  outline:none;
}

.toolbar input{
  flex:1;
}

.table-wrap{
  background:white;
  border-radius:12px;
  overflow:auto;
  border:1px solid #e1e8ed;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:900px;
}

th,td{
  padding:14px 15px;
  border-bottom:1px solid #edf1f3;
  text-align:left;
  font-size:13px;
}

th{
  background:#f7f9fa;
  color:#607482;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:800;
}

.b-PENDING{
  background:#fff3cd;
  color:#856404;
}

.b-APPROVED{
  background:#d1e7dd;
  color:#0f5132;
}

.b-REJECTED{
  background:#f8d7da;
  color:#842029;
}

.b-SUSPENDED{
  background:#e2e3e5;
  color:#41464b;
}

.actions{
  display:flex;
  gap:7px;
}

.btn{
  border:0;
  border-radius:6px;
  padding:7px 10px;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
}

.btn.ok{
  background:#198754;
  color:white;
}

.btn.no{
  background:#dc3545;
  color:white;
}

.btn.warn{
  background:#ffc107;
  color:#222;
}

.empty{
  text-align:center;
  padding:35px;
  color:#788995;
}

@media(max-width:800px){
  .cards{
    grid-template-columns:repeat(2,1fr);
  }

  .toolbar{
    flex-direction:column;
  }

  .topbar{
    padding:0 15px;
  }

  .content{
    padding:15px;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginOverlay" class="login-wrap">

  <div class="login-card">

    <div class="brand">CORE ADIIMASA</div>

    <h1>Pusat Kendali</h1>

    <div class="desc">
      Dashboard ini khusus pengelola pusat
      <b>PT Adiimasa Distribusi Indonesia</b>.
      Login dengan Google yang sudah didaftarkan sebagai Core Admin.
    </div>

    <button id="googleBtn" class="google-btn">
      <span id="googleText">G &nbsp; Masuk dengan Google</span>
    </button>

    <div id="loginMsg" class="msg"></div>

  </div>

</div>


<!-- APP -->
<div id="app" class="app hidden">

  <div class="topbar">

    <div class="logo">
      CORE ADIIMASA
    </div>

    <div class="user-area">
      <span id="userEmail"></span>
      <button id="logoutBtn" class="logout">
        Keluar
      </button>
    </div>

  </div>


  <main class="content">

    <div class="header">
      <h2>Pusat Kendali</h2>

      <button id="refresh" class="refresh">
        ↻ Refresh
      </button>
    </div>


    <div class="cards">

      <div class="card">
        <div class="card-title">PENDING</div>
        <div id="nPending" class="card-number">0</div>
      </div>

      <div class="card">
        <div class="card-title">APPROVED</div>
        <div id="nApproved" class="card-number">0</div>
      </div>

      <div class="card">
        <div class="card-title">REJECTED</div>
        <div id="nRejected" class="card-number">0</div>
      </div>

      <div class="card">
        <div class="card-title">SUSPENDED</div>
        <div id="nSuspended" class="card-number">0</div>
      </div>

    </div>


    <div class="toolbar">

      <input
        id="search"
        type="text"
        placeholder="Cari email, client, modul..."
      >

      <select id="status">
        <option value="ALL">Semua Status</option>
        <option value="PENDING">Pending</option>
        <option value="APPROVED">Approved</option>
        <option value="REJECTED">Rejected</option>
        <option value="SUSPENDED">Suspended</option>
      </select>

    </div>


    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>Email</th>
            <th>Core</th>
            <th>Modul</th>
            <th>Client</th>
            <th>Status</th>
            <th>Aksi</th>
          </tr>
        </thead>

        <tbody id="tbody">
        </tbody>

      </table>

    </div>

  </main>

</div>


<script>

const SUPABASE_URL =
  "https://fysaxpqpqexjnlpkbwap.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_DWRaEaZTcNMjhglwN3nqCOw_pua8rsjD";

const REDIRECT_URL =
  "https://adiimasadistribusiindonesia.github.io/platform_core/";


/* =====================================================
   SUPABASE CLIENT
===================================================== */

const { createClient } = window.supabase;

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);


/* =====================================================
   HELPER
===================================================== */

const $ = id => document.getElementById(id);

let data = [];


function setMsg(text, error=false){

  const el = $("loginMsg");

  el.textContent = text;

  el.className =
    "msg " + (error ? "err" : "ok");

}


function esc(value){

  return String(value ?? "")
    .replace(/[&<>'"]/g, m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "'":"&#39;",
      '"':"&quot;"
    }[m]));

}


/* =====================================================
   LOGIN GOOGLE
===================================================== */

async function loginGoogle(){

  try{

    const btn = $("googleBtn");

    btn.disabled = true;

    $("googleText").textContent =
      "Menghubungkan ke Google...";

    setMsg("Membuka login Google...");


    const { error } =
      await supabase.auth.signInWithOAuth({

        provider:"google",

        options:{
          redirectTo:REDIRECT_URL
        }

      });


    if(error){

      console.error(error);

      btn.disabled = false;

      $("googleText").textContent =
        "G  Masuk dengan Google";

      setMsg(
        "Gagal membuka login Google: " +
        error.message,
        true
      );

    }

  }catch(error){

    console.error(error);

    $("googleBtn").disabled = false;

    $("googleText").textContent =
      "G  Masuk dengan Google";

    setMsg(
      "Terjadi kesalahan: " + error.message,
      true
    );

  }

}


/* =====================================================
   CEK CORE ADMIN
===================================================== */

async function isCoreAdmin(email){

  const { data, error } =

    await supabase
      .from("core_adiimasa_admins")
      .select("email,name,is_active")
      .eq("email", email.toLowerCase())
      .eq("is_active", true)
      .maybeSingle();


  if(error){

    throw new Error(
      "Gagal memeriksa Core Admin: " +
      error.message
    );

  }


  return data;

}


/* =====================================================
   LOAD DATA
===================================================== */

async function load(){

  const {
    data: rows,
    error
  } = await supabase
    .from("geparu_admin_access")
    .select(`
      id,
      email,
      core_name,
      module_slug,
      client_name,
      approval_status,
      is_active,
      created_at,
      approved_at,
      rejected_at,
      approval_note
    `)
    .order("created_at", {
      ascending:false
    });


  if(error){

    throw new Error(
      "Gagal memuat data: " +
      error.message
    );

  }


  data = rows || [];

  render();

}


/* =====================================================
   BADGE
===================================================== */

function badge(status){

  return `
    <span class="badge b-${esc(status)}">
      ${esc(status)}
    </span>
  `;

}


/* =====================================================
   RENDER
===================================================== */

function render(){

  const q =
    $("search").value
      .toLowerCase()
      .trim();

  const status =
    $("status").value;


  let list =
    data.filter(x => {

      const matchStatus =
        status === "ALL" ||
        x.approval_status === status;


      const text = [
        x.email,
        x.client_name,
        x.module_slug,
        x.core_name
      ]
      .join(" ")
      .toLowerCase();


      return (
        matchStatus &&
        (!q || text.includes(q))
      );

    });


  const counts = {
    PENDING:0,
    APPROVED:0,
    REJECTED:0,
    SUSPENDED:0
  };


  data.forEach(x => {

    if(counts[x.approval_status] !== undefined){

      counts[x.approval_status]++;

    }

  });


  $("nPending").textContent =
    counts.PENDING;

  $("nApproved").textContent =
    counts.APPROVED;

  $("nRejected").textContent =
    counts.REJECTED;

  $("nSuspended").textContent =
    counts.SUSPENDED;


  if(!list.length){

    $("tbody").innerHTML = `
      <tr>
        <td colspan="6" class="empty">
          Belum ada data permintaan akses.
        </td>
      </tr>
    `;

    return;

  }


  $("tbody").innerHTML =
    list.map(x => {

      let actions = "";


      if(x.approval_status === "PENDING"){

        actions = `
          <button
            class="btn ok"
            onclick="act('${esc(x.id)}','APPROVED')">
            SETUJUI
          </button>

          <button
            class="btn no"
            onclick="act('${esc(x.id)}','REJECTED')">
            TOLAK
          </button>
        `;

      }


      if(x.approval_status === "APPROVED"){

        actions = `
          <button
            class="btn warn"
            onclick="act('${esc(x.id)}','SUSPENDED')">
            SUSPEND
          </button>
        `;

      }


      if(x.approval_status === "SUSPENDED"){

        actions = `
          <button
            class="btn ok"
            onclick="act('${esc(x.id)}','APPROVED')">
            AKTIFKAN
          </button>
        `;

      }


      return `
        <tr>

          <td>
            <b>${esc(x.email)}</b>
          </td>

          <td>
            ${esc(
              x.core_name ||
              "PT Adiimasa Distribusi Indonesia"
            )}
          </td>

          <td>
            ${esc(
              (x.module_slug || "")
              .toUpperCase()
            )}
          </td>

          <td>
            ${esc(
              x.client_name ||
              "GEPARU"
            )}
          </td>

          <td>
            ${badge(x.approval_status)}
          </td>

          <td>
            <div class="actions">
              ${actions}
            </div>
          </td>

        </tr>
      `;

    }).join("");

}


/* =====================================================
   UBAH STATUS
===================================================== */

async function act(id,status){

  let question = "";

  if(status === "APPROVED")
    question =
      "Setujui akses client ini?";

  if(status === "REJECTED")
    question =
      "Tolak permintaan akses ini?";

  if(status === "SUSPENDED")
    question =
      "Tangguhkan akses client ini?";


  if(!confirm(question))
    return;


  const body = {

    approval_status:status,

    is_active:
      status === "APPROVED"

  };


  if(status === "APPROVED"){

    body.approved_at =
      new Date().toISOString();

    body.rejected_at = null;

  }


  if(status === "REJECTED"){

    body.rejected_at =
      new Date().toISOString();

    body.approved_at = null;

  }


  if(status === "SUSPENDED"){

    body.approved_at = null;

  }


  const {
    error
  } = await supabase
    .from("geparu_admin_access")
    .update(body)
    .eq("id", id);


  if(error){

    alert(
      "Gagal mengubah status:\n\n" +
      error.message
    );

    return;

  }


  await load();

  alert(
    "Status berhasil diubah menjadi " +
    status
  );

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

  await supabase.auth.signOut();

  location.reload();

}


/* =====================================================
   BOOT
===================================================== */

async function boot(){

  try{

    setMsg("");


    const {
      data:{
        session
      }
    } = await supabase.auth.getSession();


    if(!session){

      $("loginOverlay")
        .classList.remove("hidden");

      return;

    }


    const user =
      session.user;


    if(!user || !user.email){

      await supabase.auth.signOut();

      $("loginOverlay")
        .classList.remove("hidden");

      setMsg(
        "Sesi Google tidak memiliki email.",
        true
      );

      return;

    }


    const admin =
      await isCoreAdmin(user.email);


    if(!admin){

      await supabase.auth.signOut();

      $("loginOverlay")
        .classList.remove("hidden");

      setMsg(
        "Akun Google berhasil login, tetapi email ini belum terdaftar sebagai Core Admin.",
        true
      );

      return;

    }


    $("userEmail").textContent =
      user.email;


    $("loginOverlay")
      .classList.add("hidden");


    $("app")
      .classList.remove("hidden");


    await load();


  }catch(error){

    console.error(error);

    $("app")
      .classList.add("hidden");


    $("loginOverlay")
      .classList.remove("hidden");


    setMsg(
      error.message ||
      "Terjadi kesalahan.",
      true
    );

  }

}


/* =====================================================
   EVENT
===================================================== */

$("googleBtn")
  .addEventListener(
    "click",
    loginGoogle
  );


$("logoutBtn")
  .addEventListener(
    "click",
    logout
  );


$("refresh")
  .addEventListener(
    "click",
    () => {

      load().catch(error => {

        alert(error.message);

      });

    }
  );


$("search")
  .addEventListener(
    "input",
    render
  );


$("status")
  .addEventListener(
    "change",
    render
  );


/* =====================================================
   MULAI
===================================================== */

boot();

</script>

</body>
</html>
