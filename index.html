<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Core Adiimasa - Pusat Kendali</title>

<style>
:root{
  --bg:#66747f;
  --card:#ffffff;
  --text:#18324a;
  --muted:#71859a;
  --line:#cbd7e2;
  --blue:#244b6b;
  --green:#16834b;
  --red:#d33c3c;
  --orange:#c87b16;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Inter,Segoe UI,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

.hidden{
  display:none !important;
}

.overlay{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-card{
  width:100%;
  max-width:430px;
  background:white;
  border-radius:20px;
  padding:34px 30px;
  box-shadow:0 20px 60px rgba(0,0,0,.18);
}

.kicker{
  font-size:13px;
  font-weight:800;
  letter-spacing:1px;
  color:#637c91;
  margin-bottom:8px;
}

h1{
  margin:0 0 14px;
  font-size:32px;
  line-height:1.1;
}

.description{
  color:#657b90;
  line-height:1.55;
  font-size:14px;
  margin-bottom:24px;
}

.google-btn{
  width:100%;
  height:50px;
  border:1px solid #c8d5df;
  background:#fff;
  border-radius:9px;
  cursor:pointer;
  font-size:16px;
  font-weight:700;
  color:#203f59;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}

.google-btn:hover{
  background:#f5f8fa;
}

.google-icon{
  font-weight:900;
  font-size:18px;
}

.msg{
  text-align:center;
  margin-top:16px;
  font-size:13px;
  min-height:18px;
}

.msg.err{
  color:var(--red);
}

.msg.ok{
  color:var(--green);
}

/* APP */

#app{
  min-height:100vh;
  background:#f4f7f9;
}

.topbar{
  background:white;
  border-bottom:1px solid #dbe3e9;
  padding:16px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.brand{
  font-size:20px;
  font-weight:800;
  color:#19354c;
}

.user-area{
  display:flex;
  align-items:center;
  gap:12px;
}

.user-email{
  color:#64798c;
  font-size:13px;
}

.logout-btn{
  border:1px solid #d3dde5;
  background:white;
  border-radius:8px;
  padding:9px 14px;
  cursor:pointer;
  font-weight:700;
}

.container{
  max-width:1250px;
  margin:auto;
  padding:28px 20px;
}

.page-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:22px;
}

.page-title h2{
  margin:0;
  font-size:25px;
}

.refresh-btn{
  border:0;
  background:#244b6b;
  color:white;
  border-radius:8px;
  padding:10px 16px;
  cursor:pointer;
  font-weight:700;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:20px;
}

.stat{
  background:white;
  border:1px solid #e0e7ec;
  border-radius:12px;
  padding:18px;
}

.stat-label{
  color:#73879a;
  font-size:13px;
}

.stat-number{
  margin-top:7px;
  font-size:27px;
  font-weight:800;
}

.controls{
  background:white;
  border:1px solid #e0e7ec;
  border-radius:12px;
  padding:15px;
  display:flex;
  gap:12px;
  margin-bottom:16px;
}

.controls input,
.controls select{
  height:42px;
  border:1px solid #cbd7e0;
  border-radius:8px;
  padding:0 12px;
  font-size:14px;
  outline:none;
}

.controls input{
  flex:1;
}

.table-card{
  background:white;
  border:1px solid #e0e7ec;
  border-radius:12px;
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:850px;
}

th,
td{
  padding:14px;
  border-bottom:1px solid #edf1f4;
  text-align:left;
  font-size:13px;
}

th{
  background:#f8fafb;
  color:#657a8d;
  font-size:12px;
  text-transform:uppercase;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:800;
}

.b-PENDING{
  background:#fff1d8;
  color:#a66300;
}

.b-APPROVED{
  background:#dff5e9;
  color:#147341;
}

.b-REJECTED{
  background:#fde3e3;
  color:#b32626;
}

.b-SUSPENDED{
  background:#e9e9e9;
  color:#555;
}

.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.btn{
  border:0;
  border-radius:7px;
  padding:7px 10px;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
}

.btn.ok{
  background:#16834b;
  color:white;
}

.btn.no{
  background:#d33c3c;
  color:white;
}

.btn.warn{
  background:#c87b16;
  color:white;
}

.empty{
  text-align:center;
  color:#8293a1;
  padding:35px;
}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#18324a;
  color:white;
  padding:13px 18px;
  border-radius:9px;
  box-shadow:0 8px 30px rgba(0,0,0,.2);
  z-index:9999;
}

@media(max-width:800px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .topbar{
    flex-direction:column;
    align-items:flex-start;
  }

  .user-area{
    width:100%;
    justify-content:space-between;
  }
}

@media(max-width:500px){
  .stats{
    grid-template-columns:1fr;
  }

  .controls{
    flex-direction:column;
  }

  .login-card{
    padding:28px 22px;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginOverlay" class="overlay">

  <div class="login-card">

    <div class="kicker">CORE ADIIMASA</div>

    <h1>Pusat Kendali</h1>

    <div class="description">
      Dashboard ini khusus pengelola pusat
      <b>PT Adiimasa Distribusi Indonesia.</b>
      Login dengan Google yang sudah didaftarkan
      sebagai Core Admin.
    </div>

    <button id="googleBtn" class="google-btn" type="button">
      <span class="google-icon">G</span>
      <span>Masuk dengan Google</span>
    </button>

    <div id="loginMsg" class="msg"></div>

  </div>

</div>


<!-- APPLICATION -->
<div id="app" class="hidden">

  <div class="topbar">

    <div class="brand">
      Core Adiimasa
    </div>

    <div class="user-area">
      <span id="userEmail" class="user-email"></span>

      <button id="logoutBtn" class="logout-btn" type="button">
        Keluar
      </button>
    </div>

  </div>


  <div class="container">

    <div class="page-title">

      <h2>Pusat Kendali</h2>

      <button id="refresh" class="refresh-btn" type="button">
        ↻ Refresh
      </button>

    </div>


    <!-- STATISTIK -->
    <div class="stats">

      <div class="stat">
        <div class="stat-label">Pending</div>
        <div id="nPending" class="stat-number">0</div>
      </div>

      <div class="stat">
        <div class="stat-label">Approved</div>
        <div id="nApproved" class="stat-number">0</div>
      </div>

      <div class="stat">
        <div class="stat-label">Rejected</div>
        <div id="nRejected" class="stat-number">0</div>
      </div>

      <div class="stat">
        <div class="stat-label">Suspended</div>
        <div id="nSuspended" class="stat-number">0</div>
      </div>

    </div>


    <!-- FILTER -->
    <div class="controls">

      <input
        id="search"
        type="text"
        placeholder="Cari email, client, module..."
      >

      <select id="status">

        <option value="ALL">
          Semua Status
        </option>

        <option value="PENDING">
          Pending
        </option>

        <option value="APPROVED">
          Approved
        </option>

        <option value="REJECTED">
          Rejected
        </option>

        <option value="SUSPENDED">
          Suspended
        </option>

      </select>

    </div>


    <!-- TABLE -->
    <div class="table-card">

      <table>

        <thead>

          <tr>
            <th>Email</th>
            <th>Core</th>
            <th>Module</th>
            <th>Client</th>
            <th>Status</th>
            <th>Aksi</th>
          </tr>

        </thead>

        <tbody id="tbody"></tbody>

      </table>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://fysaxpqpqexjnlpkbwap.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_DWRaEaZTcNMjhglwN3nqCOw_pua8rsjD";

const REDIRECT =
  "https://adiimasadistribusiindonesia.github.io/platform_core/";

let accessToken = null;
let refreshToken = null;
let currentUser = null;
let data = [];


/* =========================
   ELEMENT
========================= */

function $(id){
  return document.getElementById(id);
}


/* =========================
   MESSAGE
========================= */

function setMsg(text, error = false){

  const el = $("loginMsg");

  if(!el) return;

  el.textContent = text;

  el.className =
    "msg " + (error ? "err" : "ok");
}


/* =========================
   SESSION
========================= */

function saveSession(session){

  accessToken =
    session.access_token || null;

  refreshToken =
    session.refresh_token || null;

  if(accessToken){
    localStorage.setItem(
      "core_access_token",
      accessToken
    );
  }

  if(refreshToken){
    localStorage.setItem(
      "core_refresh_token",
      refreshToken
    );
  }
}


function clearSession(){

  accessToken = null;
  refreshToken = null;
  currentUser = null;

  localStorage.removeItem(
    "core_access_token"
  );

  localStorage.removeItem(
    "core_refresh_token"
  );

}


/* =========================
   HEADERS
========================= */

function apiHeaders(){

  return {
    "apikey": SUPABASE_KEY,
    "Authorization":
      "Bearer " + accessToken,
    "Content-Type":
      "application/json",
    "Accept":
      "application/json"
  };

}


/* =========================
   GOOGLE LOGIN
========================= */

function loginGoogle(){

  setMsg("Membuka login Google...");

  localStorage.setItem(
    "core_login_intent",
    "1"
  );

  const url =
    SUPABASE_URL +
    "/auth/v1/authorize" +
    "?provider=google" +
    "&redirect_to=" +
    encodeURIComponent(REDIRECT);

  window.location.assign(url);

}


/* =========================
   READ OAUTH TOKEN
========================= */

function parseOAuth(){

  const hash =
    window.location.hash;

  if(!hash){
    return false;
  }

  const params =
    new URLSearchParams(
      hash.substring(1)
    );

  const error =
    params.get("error");

  const errorDescription =
    params.get("error_description");

  if(error){

    setMsg(
      errorDescription ||
      "Login Google gagal.",
      true
    );

    window.history.replaceState(
      {},
      document.title,
      window.location.pathname
    );

    return false;
  }


  const token =
    params.get("access_token");

  const refresh =
    params.get("refresh_token");


  if(token){

    saveSession({
      access_token: token,
      refresh_token: refresh
    });

    window.history.replaceState(
      {},
      document.title,
      window.location.pathname
    );

    return true;
  }

  return false;

}


/* =========================
   GET USER
========================= */

async function getUser(){

  if(!accessToken){
    throw new Error(
      "Token login tidak ditemukan."
    );
  }

  const response =
    await fetch(
      SUPABASE_URL +
      "/auth/v1/user",
      {
        method:"GET",
        headers:apiHeaders()
      }
    );


  if(!response.ok){

    const text =
      await response.text();

    console.error(
      "GET USER ERROR:",
      response.status,
      text
    );

    throw new Error(
      "Sesi login sudah tidak valid."
    );

  }


  return await response.json();

}


/* =========================
   CHECK CORE ADMIN
========================= */

async function isCoreAdmin(email){

  const url =
    SUPABASE_URL +
    "/rest/v1/core_adiimasa_admins" +
    "?select=email,name,is_active" +
    "&email=eq." +
    encodeURIComponent(
      String(email).toLowerCase()
    ) +
    "&is_active=eq.true";


  const response =
    await fetch(
      url,
      {
        method:"GET",
        headers:apiHeaders()
      }
    );


  if(!response.ok){

    const text =
      await response.text();

    console.error(
      "ADMIN CHECK ERROR:",
      response.status,
      text
    );

    throw new Error(
      "Gagal memeriksa hak akses Core Admin. HTTP " +
      response.status
    );

  }


  const rows =
    await response.json();

  return rows[0] || null;

}


/* =========================
   LOAD DATA
========================= */

async function load(){

  const url =
    SUPABASE_URL +
    "/rest/v1/geparu_admin_access" +
    "?select=id,email,core_name,module_slug,client_name,approval_status,is_active,created_at,approved_at,rejected_at,approval_note" +
    "&order=created_at.desc";


  const response =
    await fetch(
      url,
      {
        method:"GET",
        headers:apiHeaders()
      }
    );


  if(!response.ok){

    const text =
      await response.text();

    throw new Error(
      "Gagal memuat permintaan akses. HTTP " +
      response.status +
      " " +
      text
    );

  }


  data =
    await response.json();

  render();

}


/* =========================
   ESCAPE HTML
========================= */

function esc(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>'"]/g,
    function(char){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        "'":"&#39;",
        '"':"&quot;"

      }[char];

    }
  );

}


/* =========================
   BADGE
========================= */

function badge(status){

  const safe =
    String(status || "")
      .toUpperCase();

  return `
    <span class="badge b-${safe}">
      ${esc(safe)}
    </span>
  `;

}


/* =========================
   RENDER
========================= */

function render(){

  const search =
    $("search").value
      .trim()
      .toLowerCase();

  const status =
    $("status").value;


  const list =
    data.filter(function(row){

      const matchStatus =
        status === "ALL" ||
        row.approval_status === status;


      const text = [
        row.email,
        row.client_name,
        row.module_slug,
        row.core_name
      ]
      .join(" ")
      .toLowerCase();


      const matchSearch =
        !search ||
        text.includes(search);


      return (
        matchStatus &&
        matchSearch
      );

    });


  const count = {
    PENDING:0,
    APPROVED:0,
    REJECTED:0,
    SUSPENDED:0
  };


  data.forEach(function(row){

    const s =
      String(
        row.approval_status || ""
      ).toUpperCase();

    if(count[s] !== undefined){
      count[s]++;
    }

  });


  $("nPending").textContent =
    count.PENDING;

  $("nApproved").textContent =
    count.APPROVED;

  $("nRejected").textContent =
    count.REJECTED;

  $("nSuspended").textContent =
    count.SUSPENDED;


  if(!list.length){

    $("tbody").innerHTML = `
      <tr>
        <td colspan="6" class="empty">
          Belum ada data permintaan akses.
        </td>
      </tr>
    `;

    return;

  }


  $("tbody").innerHTML =
    list.map(function(row){

      const status =
        String(
          row.approval_status || ""
        ).toUpperCase();


      let actions = "";


      if(status === "PENDING"){

        actions = `
          <button
            class="btn ok"
            type="button"
            onclick="act('${esc(row.id)}','APPROVED')">
            SETUJUI
          </button>

          <button
            class="btn no"
            type="button"
            onclick="act('${esc(row.id)}','REJECTED')">
            TOLAK
          </button>
        `;

      }


      if(status === "APPROVED"){

        actions = `
          <button
            class="btn warn"
            type="button"
            onclick="act('${esc(row.id)}','SUSPENDED')">
            SUSPEND
          </button>
        `;

      }


      if(status === "SUSPENDED"){

        actions = `
          <button
            class="btn ok"
            type="button"
            onclick="act('${esc(row.id)}','APPROVED')">
            AKTIFKAN
          </button>
        `;

      }


      return `
        <tr>

          <td>
            <b>${esc(row.email)}</b>
          </td>

          <td>
            ${esc(
              row.core_name ||
              "PT Adiimasa Distribusi Indonesia"
            )}
          </td>

          <td>
            ${esc(
              String(
                row.module_slug || ""
              ).toUpperCase()
            )}
          </td>

          <td>
            ${esc(
              row.client_name ||
              "GEPARU"
            )}
          </td>

          <td>
            ${badge(status)}
          </td>

          <td>
            <div class="actions">
              ${actions}
            </div>
          </td>

        </tr>
      `;

    }).join("");

}


/* =========================
   CHANGE STATUS
========================= */

async function act(id,status){

  let message = "";

  if(status === "APPROVED"){
    message =
      "Setujui akses client ini?";
  }

  if(status === "REJECTED"){
    message =
      "Tolak permintaan akses ini?";
  }

  if(status === "SUSPENDED"){
    message =
      "Tangguhkan akses client ini?";
  }


  if(!confirm(message)){
    return;
  }


  const body = {
    approval_status:status,
    is_active:
      status === "APPROVED"
  };


  if(status === "APPROVED"){

    body.approved_at =
      new Date().toISOString();

    body.rejected_at = null;

  }


  if(status === "REJECTED"){

    body.rejected_at =
      new Date().toISOString();

    body.approved_at = null;

  }


  if(status === "SUSPENDED"){

    body.approved_at = null;

  }


  const url =
    SUPABASE_URL +
    "/rest/v1/geparu_admin_access" +
    "?id=eq." +
    encodeURIComponent(id);


  const response =
    await fetch(
      url,
      {
        method:"PATCH",
        headers:{
          ...apiHeaders(),
          "Prefer":
            "return=minimal"
        },
        body:
          JSON.stringify(body)
      }
    );


  if(!response.ok){

    alert(
      "Gagal mengubah status:\n\n" +
      await response.text()
    );

    return;

  }


  await load();

  toast(
    "Status berhasil diubah menjadi " +
    status
  );

}


/* =========================
   TOAST
========================= */

function toast(text){

  const element =
    document.createElement("div");

  element.className =
    "toast";

  element.textContent =
    text;

  document.body.appendChild(
    element
  );


  setTimeout(
    function(){
      element.remove();
    },
    2600
  );

}


/* =========================
   LOGOUT
========================= */

function logout(){

  clearSession();

  window.location.reload();

}


/* =========================
   BOOT
========================= */

async function boot(){

  try{

    parseOAuth();


    accessToken =
      localStorage.getItem(
        "core_access_token"
      );

    refreshToken =
      localStorage.getItem(
        "core_refresh_token"
      );


    /*
      Kalau tidak ada token,
      tampilkan halaman login.
    */

    if(!accessToken){

      $("loginOverlay")
        .classList.remove("hidden");

      return;

    }


    /*
      Cek token langsung ke Supabase.
    */

    currentUser =
      await getUser();


    /*
      Cek apakah email adalah
      Core Admin aktif.
    */

    const admin =
      await isCoreAdmin(
        currentUser.email
      );


    if(!admin){

      clearSession();

      $("loginOverlay")
        .classList.remove("hidden");

      setMsg(
        "Akun Google berhasil login, tetapi email ini belum terdaftar sebagai Core Admin.",
        true
      );

      return;

    }


    /*
      Login berhasil.
    */

    $("userEmail").textContent =
      currentUser.email;

    $("loginOverlay")
      .classList.add("hidden");

    $("app")
      .classList.remove("hidden");


    await load();


  }catch(error){

    console.error(
      "BOOT ERROR:",
      error
    );


    clearSession();

    $("loginOverlay")
      .classList.remove("hidden");

    setMsg(
      error.message ||
      "Terjadi kesalahan saat login.",
      true
    );

  }

}


/* =========================
   EVENTS
========================= */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    $("googleBtn")
      .addEventListener(
        "click",
        loginGoogle
      );


    $("logoutBtn")
      .addEventListener(
        "click",
        logout
      );


    $("refresh")
      .addEventListener(
        "click",
        function(){

          load()
            .catch(function(error){

              alert(
                error.message
              );

            });

        }
      );


    $("search")
      .addEventListener(
        "input",
        render
      );


    $("status")
      .addEventListener(
        "change",
        render
      );


    boot();

  }
);

</script>

</body>
</html>
